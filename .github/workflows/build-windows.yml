# Windows 打包（nsis 安装包）
# 触发：手动 workflow_dispatch，或推送 v* 标签
#
# 本地等价流程见 frontend/scripts/prepare-windows-sidecars.ps1（装 ffmpeg.exe + llama-helper.exe）。
#
# ── 构建耗时说明（2026-09-30 实测）────────────────────────────────────────────
#   一次完整 release 构建 = 52.7 分钟，其中：
#       Rust release 构建        29.3 分  ← 依赖编译（~800 个 crate）
#       Tauri 打包（含再编译）    12.1 分
#       llama-helper 编译         9.5 分
#       其余 15 个步骤合计        1.8 分
#   也就是说 97% 的时间在编译依赖，跟改动量无关 —— 所以**缓存能不能命中是唯一关键**。
#
#   而此前缓存是坏的：rust-cache 只存了 0.19 GB（正常的 target 应该 3~6 GB），
#   原因是**早期一次失败的运行**存下了一个不含 target 的缓存，之后 key 一直没变，
#   rust-cache 就永远「命中」它、**跳过保存**，于是每次都是冷构建。
#   → 下面用 prefix-key 换代强制重建；RUSTFLAGS / Cargo.lock 变化也会自动换 key。
#
#   两种档位（workflow_dispatch 的 profile 输入）：
#       release（默认）52 分 → 缓存生效后约 10 分，发布用
#       dev             约 15 分，UI 验证用（程序跑得慢些，界面完全一样）
#
# 关键约束（都踩过，别再改回去）：
#   1) `pnpm install` 必须带 `--ignore-workspace`：仓库根有 pnpm-workspace.yaml，
#      不加的话 pnpm 会按 workspace 根安装，frontend/node_modules 根本不会生成。
#      同样原因，frontend 的 pnpm 命令都不要在仓库根跑。
#   2) 仓库根是 cargo workspace（members = frontend/src-tauri + llama-helper），
#      所以构建产物在 **<repo>/target/** 下，不是 llama-helper/target/ 也不是
#      frontend/src-tauri/target/。以前 CI 去 llama-helper/target 拷 exe 是错的。
#   3) 运行时 DLL（sherpa-onnx-c-api/cxx-api、onnxruntime、onnxruntime_providers_shared）
#      由 src-tauri/build.rs 在 Windows 构建时自动从 target/<profile> 暂存到
#      src-tauri/resources-dll/，再由 tauri.windows.conf.json 的 bundle.resources 打进包。
#      下面「Verify runtime DLLs」会硬性拦住 0 字节/缺失的情况 —— 不要删。
#   4) 先单独跑一次 `cargo build -p voxminutes` 让 build.rs 完成暂存与校验，
#      再 `pnpm tauri build`（第二次是增量，不会重复编译）。
#   5) ffmpeg.exe 的下载地址可能变，失败时换 BtbN 的包。

name: Build Windows (nsis)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '构建档位：release=发布用（慢）｜dev=UI 验证用（快，程序慢一些）'
        type: choice
        options: [release, dev]
        default: release
        required: true
      use_lld:
        description: '用 lld 链接器加速（若链接失败可关掉重跑）'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # 需要写权限才能把安装包发布到 Releases（GITHUB_TOKEN 默认对私有仓库是只读）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ── 解析构建档位 ────────────────────────────────────────────────────
      # 统一用 `cargo build --profile <x>`：release 走 target/release，
      # dev 走 target/debug。tauri build 对 dev 档要额外加 --debug。
      - name: Resolve build profile
        shell: pwsh
        run: |
          $p = "${{ github.event.inputs.profile }}"
          if ($p -ne "dev") { $p = "release" }
          if ($p -eq "dev") {
            $dir = "debug"; $flag = "--debug"; $tag = "windows-latest-dev"
          } else {
            $dir = "release"; $flag = ""; $tag = "windows-latest"
          }
          "BUILD_PROFILE=$p"  >> $env:GITHUB_ENV
          "TARGET_DIR=$dir"   >> $env:GITHUB_ENV
          "TAURI_FLAG=$flag"  >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag"  >> $env:GITHUB_ENV
          Write-Host "档位=$p  产物目录=target/$dir  Release tag=$tag"

      - uses: actions/setup-node@v4
        with:
          # ⚠️ 必须 ≥ 22.13：pnpm 11 依赖 Node 内置的 `node:sqlite`，
          # Node 20 上会直接 ERR_UNKNOWN_BUILTIN_MODULE 崩掉（2026-09-30 实测）。
          # 本机开发用的是 Node 26 + pnpm 11，这里对齐大版本。
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          # ⚠️ 必须跟本机开发用的 pnpm 大版本一致（本机 11.x）。
          # 2026-09-30 实测：pnpm **v9** 在 `pnpm tauri build` 阶段直接报
          #   ERROR  packages field missing or empty
          # 因为仓库根的 pnpm-workspace.yaml 只有 allowBuilds、**没有 packages 字段**
          # （见 frontend/.npmrc 的说明：根 workspace 不属于本项目构建）。
          # pnpm 11 对这种情况只警告「No projects found」并继续，v9 直接退出。
          version: '11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── lld 链接器 ──────────────────────────────────────────────────────
      # MSVC 自带的 link.exe 链接这个含 sherpa-onnx + onnxruntime 的大二进制很慢，
      # lld 通常快 2~4 倍。windows-latest 镜像自带 LLVM。
      # 注意：改 RUSTFLAGS 会使 rust-cache 的 key 变化（首次会全量重编，属预期）。
      - name: Use lld linker (faster linking)
        if: ${{ github.event.inputs.use_lld != 'false' }}
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path "$llvm\lld-link.exe") {
            "$llvm" >> $env:GITHUB_PATH
            "RUSTFLAGS=-C linker=lld-link" >> $env:GITHUB_ENV
            Write-Host "✅ 启用 lld-link：$llvm"
            & "$llvm\lld-link.exe" --version
          } else {
            Write-Host "::warning::没找到 lld-link.exe，退回 MSVC link.exe（会慢一些）"
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # ⚠️ 换代前缀（2026-09-30）：旧缓存只含 cargo registry（0.19 GB）、不含 target，
          # 且因为 key 没变，rust-cache 每次都「命中」它并**跳过保存** →
          # 52 分钟里 51 分钟都在重编依赖。改这个前缀会强制重新保存一份完整缓存。
          # 以后再遇到「缓存看着命中但构建依然很慢」，就把 v1 改成 v2、v3… 再跑一次。
          # ⚠️ v1 → v2（2026-09-30）：v1 那次缓存虽然省了编译时间，但暴露了
          #   「运行时 DLL 不在 cargo 缓存里」→ 打包必失败（见下面 Force re-stage 的注释）。
          #   改用 v2 走一次冷构建，把 DLL 重新产出并写进下面的 resources-dll 专用缓存；
          #   之后 v2 缓存 + resources-dll 缓存都在，才既快又能出包。
          # v2 → v3（2026-09-30）：v2 那份缓存只覆盖了 cargo 自己的产物，
          # 恢复了 ort-sys / sherpa-onnx-sys 的**指纹**却没恢复它们的构建脚本产物
          # （.lib/.dll）→ 链接必失败。改用 v3 走一次干净冷构建，
          # 把 build-script-out 缓存填上；之后两者一致才稳。
          prefix-key: v3-rust
          # 失败也要存缓存：首次失败在最后一步（打包），若不留缓存，
          # 下一次重跑要白白再编译 30 多分钟。
          cache-on-failure: true

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --ignore-workspace

      # ── 侧车（externalBin）───────────────────────────────────────────────
      # Tauri 按 target triple 找 binaries/<name>-<triple>[.exe]，
      # 少一个都会在 `tauri build` 阶段直接报错。
      - name: Build llama-helper sidecar
        run: cargo build --profile ${{ env.BUILD_PROFILE }} -p llama-helper

      - name: Download ffmpeg.exe
        shell: pwsh
        run: |
          $dst = "frontend/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $bin = Get-ChildItem -Path ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName "$dst/ffmpeg-x86_64-pc-windows-msvc.exe" -Force

      - name: Stage sidecars into binaries/
        shell: pwsh
        run: |
          $dst = "frontend/src-tauri/binaries"
          Copy-Item "target/${{ env.TARGET_DIR }}/llama-helper.exe" `
            "$dst/llama-helper-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem $dst | Format-Table Name, Length

      # ── 运行时 DLL 专用缓存（**这是真正的解法**）──────────────────────────
      # 为什么不能只靠 rust-cache：onnxruntime.dll / sherpa-onnx-*.dll 是
      #   ort-sys / sherpa-onnx-sys **构建时的副作用产物**（下载后复制），
      #   cargo 不把它们当产物，rust-cache 也就不会缓存；
      #   缓存命中时 build script 不重跑 → DLL 从未出现 → 打包报
      #   "resource path `resources-dll\onnxruntime.dll` doesn't exist"。
      # 实测过两条不奏效的路：① 删 build 目录逼 build script 重跑（重跑后 DLL 落在
      #   别处，甚至不重新下载）；② src-tauri/build.rs 递归搜索（target/ 里根本没有）。
      # 所以干脆把 build.rs **已经暂存好的** resources-dll/ 直接缓存起来 ——
      # 只要成功构建过一次，之后每次都能命中。
      - name: Cache build-script outputs
        uses: actions/cache@v4
        with:
          # ⚠️ 两个都要缓存，缺一不可（2026-09-30 血泪）：
          #   ① target/<profile>/build —— ort-sys / sherpa-onnx-sys 的构建脚本产物：
          #      **链接期必需的 import 库** sherpa-onnx-c-api.lib 就在这里。
          #      只缓存 resources-dll（只有 .dll）不够：rust-cache 会恢复**指纹**
          #      让 cargo 以为这个 crate 已经构建好了，从而跳过构建脚本 ——
          #      但产物 `.lib` 不在 cargo 的缓存范围内 → 链接报
          #        lld-link: error: could not open 'sherpa-onnx-c-api.lib'
          #   ② frontend/src-tauri/resources-dll —— build.rs 暂存好的运行时 DLL
          path: |
            frontend/src-tauri/resources-dll
            target/${{ env.TARGET_DIR }}/build
          key: build-script-out-${{ env.TARGET_DIR }}-${{ hashFiles('Cargo.lock') }}

      # ── 主程序：先 build 一次，让 build.rs 把运行时 DLL 暂存到 resources-dll/ ──
      - name: Build app (stages runtime DLLs via build.rs)
        run: cargo build --profile ${{ env.BUILD_PROFILE }} -p voxminutes

      - name: Verify runtime DLLs
        shell: pwsh
        run: |
          $dir = "frontend/src-tauri/resources-dll"
          $required = @(
            "sherpa-onnx-c-api.dll",
            "sherpa-onnx-cxx-api.dll",
            "onnxruntime.dll",
            "onnxruntime_providers_shared.dll"
          )
          $bad = @()
          foreach ($n in $required) {
            $p = Join-Path $dir $n
            $len = if (Test-Path $p) { (Get-Item $p).Length } else { 0 }
            Write-Host ("{0,-40} {1} bytes" -f $n, $len)
            if ($len -le 0) { $bad += $n }
          }
          if ($bad.Count -gt 0) {
            Write-Error ("运行时 DLL 缺失或为 0 字节: " + ($bad -join ", ") + "`n" +
              "原因通常是 sherpa-onnx(shared) / ort 的构建脚本没能下载预编译库（网络/代理）。`n" +
              "没有这些 DLL，装出来的包在 Windows 上本地语音识别与 OPUS-MT 翻译会加载失败。")
            exit 1
          }

      - name: Build Tauri app (nsis)
        working-directory: frontend
        # 这步会顺带跑 tauri.conf.json 的 beforeBuildCommand（`pnpm build` = next build）。
        # TAURI_FLAG 在 dev 档是 --debug（产物进 target/debug/bundle）。
        run: pnpm tauri build ${{ env.TAURI_FLAG }}
        env:
          # 让 Tauri CLI 不要在 CI 上尝试彩色/交互输出（日志更干净）
          CI: 'true'
          # ⚠️ 自动更新的签名密钥（2026-09-30 启用 updater 后**必须**有）：
          # tauri.conf.json 的 bundle.createUpdaterArtifacts = true 会让 Tauri CLI
          # 在打包后**用私钥给更新包盖章**（生成 .nsis.zip.sig）。
          # 没有这两个变量 → 构建直接失败。
          # 私钥的离线备份见用户移动硬盘 / 桌面「VoxMinutes签名密钥备份」文件夹，
          # 详细说明见 voxminutes/自动更新与签名密钥说明.md
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify updater artifacts (签名产物必须存在)
        shell: pwsh
        run: |
          $dir = "target/${{ env.TARGET_DIR }}/bundle/nsis"
          $zip = Get-ChildItem $dir -Filter *.nsis.zip -ErrorAction SilentlyContinue
          $sig = Get-ChildItem $dir -Filter *.nsis.zip.sig -ErrorAction SilentlyContinue
          if (-not $zip) { Write-Error "❌ 没有 .nsis.zip：createUpdaterArtifacts 没生效，自动更新会失效"; exit 1 }
          if (-not $sig) { Write-Error "❌ 没有 .sig 签名：签名密钥没配好（TAURI_SIGNING_PRIVATE_KEY？），自动更新会失效"; exit 1 }
          Write-Host "✅ 更新载荷: $($zip.Name)  $([math]::Round($zip.Length/1MB,1)) MB"
          Write-Host "✅ 签名文件: $($sig.Name)  $($sig.Length) 字节"

      - name: Upload nsis installer
        uses: actions/upload-artifact@v4
        with:
          name: voxminutes-windows-${{ env.BUILD_PROFILE }}
          # 仓库根是 cargo workspace，bundle 产物在 <repo>/target/<profile> 下
          # .exe = 完整安装包；.nsis.zip = 自动更新的载荷；.sig = 签名
          path: |
            target/${{ env.TARGET_DIR }}/bundle/nsis/*.exe
            target/${{ env.TARGET_DIR }}/bundle/nsis/*.nsis.zip
            target/${{ env.TARGET_DIR }}/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error

      # ── 固定入口：每次构建都更新同一个 Release ────────────────────────────
      # 为什么要这一步：Actions 的 Artifacts 藏在每次运行页面里，找起来很麻烦；
      # 而且 90 天就过期。这里把安装包同时挂到固定 tag 上，于是永远有稳定下载页：
      #   release 档 → /releases/tag/windows-latest       （正式测试包）
      #   dev     档 → /releases/tag/windows-latest-dev   （UI 验证包，单独放，
      #                避免 debug 包覆盖掉正式测试包）
      - name: Publish to Releases (always-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VoxMinutes · Windows 最新构建（${{ env.BUILD_PROFILE }}）
          prerelease: false
          # 同名资产会被替换，保证这个页面永远是最新的
          files: |
            target/${{ env.TARGET_DIR }}/bundle/nsis/*.exe
            target/${{ env.TARGET_DIR }}/bundle/nsis/*.nsis.zip
            target/${{ env.TARGET_DIR }}/bundle/nsis/*.nsis.zip.sig
          body: |
            **这是自动发布的最新 Windows 构建**（档位：`${{ env.BUILD_PROFILE }}`），每次 CI 构建成功后覆盖更新。

            - 提交：`${{ github.sha }}`
            - 运行：[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            > `dev` 档是为**界面验证**准备的快速构建（约 15 分钟），程序本身比 release 慢，
            > 请勿用于正式测试。

            安装说明：双击安装包 → 出现「Windows 已保护你的电脑」时点
            **「更多信息」→「仍要运行」**（未做代码签名，属预期现象）。
