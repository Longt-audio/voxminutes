# Windows 打包（nsis 安装包）
# 触发：手动 workflow_dispatch，或推送 v* 标签
#
# 本地等价流程见 frontend/scripts/prepare-windows-sidecars.ps1（装 ffmpeg.exe + llama-helper.exe）。
#
# 关键约束（都踩过，别再改回去）：
#   1) `pnpm install` 必须带 `--ignore-workspace`：仓库根有 pnpm-workspace.yaml，
#      不加的话 pnpm 会按 workspace 根安装，frontend/node_modules 根本不会生成。
#      同样原因，frontend 的 pnpm 命令都不要在仓库根跑。
#   2) 仓库根是 cargo workspace（members = frontend/src-tauri + llama-helper），
#      所以构建产物在 **<repo>/target/** 下，不是 llama-helper/target/ 也不是
#      frontend/src-tauri/target/。以前 CI 去 llama-helper/target 拷 exe 是错的。
#   3) 运行时 DLL（sherpa-onnx-c-api/cxx-api、onnxruntime、onnxruntime_providers_shared）
#      由 src-tauri/build.rs 在 Windows 构建时自动从 target/release 暂存到
#      src-tauri/resources-dll/，再由 tauri.windows.conf.json 的 bundle.resources 打进包。
#      下面「Verify runtime DLLs」会硬性拦住 0 字节/缺失的情况 —— 不要删。
#   4) 先单独跑一次 `cargo build -p voxminutes` 让 build.rs 完成暂存与校验，
#      再 `pnpm tauri build`（第二次是增量，不会重复编译）。
#   5) ffmpeg.exe 的下载地址可能变，失败时换 BtbN 的包。

name: Build Windows (nsis)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # 需要写权限才能把安装包发布到 Releases（GITHUB_TOKEN 默认对私有仓库是只读）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ 必须 ≥ 22.13：pnpm 11 依赖 Node 内置的 `node:sqlite`，
          # Node 20 上会直接 ERR_UNKNOWN_BUILTIN_MODULE 崩掉（2026-09-30 实测）。
          # 本机开发用的是 Node 26 + pnpm 11，这里对齐大版本。
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          # ⚠️ 必须跟本机开发用的 pnpm 大版本一致（本机 11.x）。
          # 2026-09-30 实测：pnpm **v9** 在 `pnpm tauri build` 阶段直接报
          #   ERROR  packages field missing or empty
          # 因为仓库根的 pnpm-workspace.yaml 只有 allowBuilds、**没有 packages 字段**
          # （见 frontend/.npmrc 的说明：根 workspace 不属于本项目构建）。
          # pnpm 11 对这种情况只警告「No projects found」并继续，v9 直接退出。
          version: '11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # 失败也要存缓存：首次失败在最后一步（打包），若不留缓存，
          # 下一次重跑要白白再编译 32 分钟。
          cache-on-failure: true

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --ignore-workspace

      # ── 侧车（externalBin）───────────────────────────────────────────────
      # Tauri 按 target triple 找 binaries/<name>-<triple>[.exe]，
      # 少一个都会在 `tauri build` 阶段直接报错。
      - name: Build llama-helper sidecar
        run: cargo build --release -p llama-helper

      - name: Download ffmpeg.exe
        shell: pwsh
        run: |
          $dst = "frontend/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $bin = Get-ChildItem -Path ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName "$dst/ffmpeg-x86_64-pc-windows-msvc.exe" -Force

      - name: Stage sidecars into binaries/
        shell: pwsh
        run: |
          $dst = "frontend/src-tauri/binaries"
          Copy-Item "target/release/llama-helper.exe" `
            "$dst/llama-helper-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem $dst | Format-Table Name, Length

      # ── 主程序：先 build 一次，让 build.rs 把运行时 DLL 暂存到 resources-dll/ ──
      - name: Build app (stages runtime DLLs via build.rs)
        run: cargo build --release -p voxminutes

      - name: Verify runtime DLLs
        shell: pwsh
        run: |
          $dir = "frontend/src-tauri/resources-dll"
          $required = @(
            "sherpa-onnx-c-api.dll",
            "sherpa-onnx-cxx-api.dll",
            "onnxruntime.dll",
            "onnxruntime_providers_shared.dll"
          )
          $bad = @()
          foreach ($n in $required) {
            $p = Join-Path $dir $n
            $len = if (Test-Path $p) { (Get-Item $p).Length } else { 0 }
            Write-Host ("{0,-40} {1} bytes" -f $n, $len)
            if ($len -le 0) { $bad += $n }
          }
          if ($bad.Count -gt 0) {
            Write-Error ("运行时 DLL 缺失或为 0 字节: " + ($bad -join ", ") + "`n" +
              "原因通常是 sherpa-onnx(shared) / ort 的构建脚本没能下载预编译库（网络/代理）。`n" +
              "没有这些 DLL，装出来的包在 Windows 上本地语音识别与 OPUS-MT 翻译会加载失败。")
            exit 1
          }

      - name: Build Tauri app (nsis)
        working-directory: frontend
        # 这步会顺带跑 tauri.conf.json 的 beforeBuildCommand（`pnpm build` = next build）。
        run: pnpm tauri build
        env:
          # 让 Tauri CLI 不要在 CI 上尝试彩色/交互输出（日志更干净）
          CI: 'true'

      - name: Upload nsis installer
        uses: actions/upload-artifact@v4
        with:
          name: voxminutes-windows
          # 仓库根是 cargo workspace，bundle 产物在 <repo>/target 下
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # ── 固定入口：每次构建都更新同一个 Release ────────────────────────────
      # 为什么要这一步：Actions 的 Artifacts 藏在每次运行页面里，找起来很麻烦；
      # 而且 90 天就过期。这里把安装包同时挂到固定的 tag `windows-latest` 上，
      # 于是永远有一个稳定的下载页：
      #   https://github.com/Long-t-audio/voxminutes-build/releases/tag/windows-latest
      # 同一个 tag 会被反复更新（资产替换），所以「最新安装包永远在这里」。
      - name: Publish to Releases (always-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: VoxMinutes · Windows 最新构建（自动更新）
          prerelease: false
          # 同名资产会被替换，保证这个页面永远是最新的
          files: target/release/bundle/nsis/*.exe
          body: |
            **这是自动发布的最新 Windows 测试构建**，每次 CI 构建成功后覆盖更新。

            - 提交：`${{ github.sha }}`
            - 运行：[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            安装说明：双击安装包 → 出现「Windows 已保护你的电脑」时点
            **「更多信息」→「仍要运行」**（未做代码签名，属预期现象）。
